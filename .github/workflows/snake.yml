name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: FabrizioMSP
          outputs: |
            dist/github-snake.svg?color_snake=#a855f7&color_dots=#ebedf0,#d8b4fe,#c084fc,#a855f7,#7e22ce
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a855f7&color_dots=#161b22,#3b0764,#6b21a8,#9333ea,#a855f7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
